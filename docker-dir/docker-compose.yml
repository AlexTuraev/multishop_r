services:
  postgres-myshop-db:
    image: 'postgres:16.2-alpine'
    container_name: 'postgres-myshop-db'
    ports:
      - '5432:5432'
    volumes:
      - './.postgres-data:/var/lib/postgresql/myshop/data'
    environment:
      LC_ALL: 'C.UTF-8'
      #    задать пользователя
      POSTGRES_USER: 'admin'
      #    задать пароль
      POSTGRES_PASSWORD: 'admin'
      POSTGRES_DB: 'myshop'
      PGDATA: '/var/lib/postgresql/data'
    restart: unless-stopped


  redis:
    image: redis:7.4.2-bookworm
    container_name: redis_container
#    environment:
#      - REDIS_PASSWORD=admin
#      - REDIS_USER=my_user
#      - REDIS_USER_PASSWORD=my_user_password
    ports:
      - "6379:6379"
    volumes:
      - ./redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
